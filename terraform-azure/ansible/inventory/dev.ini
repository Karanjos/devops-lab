# Fill in the public IPs from `terraform output` after `terraform apply`. Group names match
# the roles applied in playbooks/site.yml - don't rename them without updating site.yml too.

[app]
app-vm ansible_host=REPLACE_WITH_app_vm_public_ip

[jenkins]
jenkins-vm ansible_host=REPLACE_WITH_jenkins_vm_public_ip

[all:vars]
ansible_user=REPLACE_WITH_admin_username
# The private half of the public key you put in terraform.tfvars as ssh_public_key.
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
