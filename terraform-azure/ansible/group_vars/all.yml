timezone: Asia/Kolkata

common_packages:
  - curl
  - wget
  - git
  - unzip
  - ca-certificates
  - gnupg
  - lsb-release
  - ufw
  - fail2ban

ssh_port: 22

# Each group overrides this with whatever inbound app port it actually needs — the Azure
# NSG already restricts source IPs, ufw here is defense-in-depth, not the only control.
ufw_extra_allow_ports: []
