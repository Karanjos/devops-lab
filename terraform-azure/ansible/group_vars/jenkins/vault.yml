# This file holds the one real secret in this repo: the Jenkins admin password that the
# basic-security.groovy init script uses to create the admin account on first boot.
#
# Encrypt it before you commit anything, or even run the playbook for real:
#   ansible-vault encrypt group_vars/jenkins/vault.yml
#
# Edit it later (while encrypted) with:
#   ansible-vault edit group_vars/jenkins/vault.yml
#
# Run the playbook with either:
#   ansible-playbook playbooks/site.yml --ask-vault-pass
#   ansible-playbook playbooks/site.yml --vault-password-file ~/.vault_pass.txt   # gitignored, chmod 600

vault_jenkins_admin_password: "ChangeMe-Str0ng-Passw0rd!"
