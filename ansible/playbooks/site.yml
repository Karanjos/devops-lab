- name: Baseline every VM
  hosts: all
  become: true
  roles:
    - common

- name: App VM - Docker, to run the stack via docker-compose
  hosts: app
  become: true
  roles:
    - docker

- name: Jenkins VM - Java, Docker, Maven, AZ cli, then Jenkins itself (controller + its own agent)
  hosts: jenkins
  become: true
  roles:
    - java
    - docker
    - maven
    - jenkins
    - azure-cli
