# Defaults suit "run the backend on my laptop, infra in Docker" (Phase 1).
# Everything is overridable with environment variables, which is how Docker/Kubernetes configure it.
server:
  port: 8081          # only used by `mvn spring-boot:run`; a standalone Tomcat uses its own port (8080)

spring:
  application:
    name: orders-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # fine for a lab; use Flyway migrations for real projects
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
    consumer:
      auto-offset-reset: earliest

app:
  kafka:
    enabled: ${KAFKA_ENABLED:true}   # false = Phase 1 mode, orders are processed synchronously

management:
  endpoints:
    web:
      base-path: /api/actuator      # keeps everything under /api so Nginx needs one rule
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true               # /api/actuator/health/liveness and /readiness for Kubernetes
